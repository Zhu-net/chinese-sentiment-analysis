version: "3.8"

services:
  sentiment-api:
    build: .
    container_name: sentiment-analysis-api
    ports:
      - "8000:8000"
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

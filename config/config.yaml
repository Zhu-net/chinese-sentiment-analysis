# ========== 项目全局配置 ==========
project:
  name: "chinese-sentiment-analysis"
  version: "1.0.0"
  seed: 42  # 随机种子，保证实验可复现

# ========== 数据配置 ==========
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"              # 二分类（外卖评论）
  processed_dir_emotion: "data/processed_emotion"  # 情绪6分类（微博）
  # 数据集划分比例
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  # 文本最大长度（BERT 输入）
  max_length: 128

# ========== 模型配置 ==========
model:
  # 预训练模型（优先使用本地路径，避免网络问题）
  pretrained_model: "saved_models/bert-base-chinese"
  num_labels: 2  # 二分类：正面 / 负面
  dropout: 0.1

# ========== 情绪多分类任务配置 ==========
emotion:
  num_labels: 6
  # ID 顺序 = 模型输出顺序，与 prepare_emotion_data.py 保持一致
  labels: ["happy", "grateful", "sad", "angry", "fear", "anxious"]
  labels_cn: ["开心", "感激", "悲伤", "愤怒", "恐惧", "焦虑"]
  emojis: ["😄", "🙏", "😢", "😠", "😨", "😰"]
  # 情绪 -> 极性映射（供 API 兼容二分类的正/负面语义）
  polarity:
    happy: "正面"
    grateful: "正面"
    sad: "负面"
    angry: "负面"
    fear: "负面"
    anxious: "负面"
  # 情绪主题色（前端渐变卡片/图表用）
  colors: ["#F59E0B", "#10B981", "#3B82F6", "#EF4444", "#8B5CF6", "#EC4899"]
  model_file: "bert_emotion_fixed_best.pt"   # 线上部署用：test标签修正后最优模型（Acc 0.8417, macro-F1 0.7850）
  model_file_cleaned: "bert_emotion_cleaned_best.pt"   # 清洗后数据重训的 baseline
  model_file_fixed: "bert_emotion_fixed_best.pt"      # test 标签修正后数据重训
  model_file_fixed2: "bert_emotion_fixed2_best.pt"     # train+test 标签修正后数据重训
  model_file_scl: "bert_emotion_scl_best.pt"
  tokenizer_dir: "bert_emotion_tokenizer"

# ========== 训练配置 ==========
train:
  batch_size: 16
  epochs: 5
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  # 早停
  early_stopping_patience: 3
  # 日志与保存
  log_dir: "logs"
  save_dir: "saved_models"
  logging_steps: 50

  # ===== 监督对比学习（SCL）配置 =====
  scl:
    enabled: true            # 是否启用对比损失
    lambda_scl: 0.1          # SCL 损失权重（相对 CE）
    temperature: 0.07        # 对比损失温度系数
    projection_dim: 128      # 投影头输出维度

  # ===== 两阶段训练：CE 预训练 -> 冻结底层 SCL 微调 =====
  two_stage:
    stage1_ckpt: "bert_emotion_best.pt"   # 阶段1产出（纯 CE 5 epoch，直接复用，不重训）
    model_file: "bert_emotion_scl2_best.pt"
    freeze_layers: 8         # 冻结 BERT embeddings + 前 N 层 encoder，仅微调后 (12-N) 层
    batch_size: 32           # 冻结后配合梯度检查点，增大 batch 提供更多正样本对
    epochs: 3
    learning_rate: 1.0e-5    # 可训练 BERT 层小学习率（head 自动 50x）
    lambda_scl: 0.05         # 微调期对比权重调小，避免破坏 CE 已学好的决策面
    temperature: 0.07
    gradient_checkpointing: true

# ========== 部署配置 ==========
deploy:
  host: "0.0.0.0"
  port: 8000
  model_path: "saved_models/best_model"

# ========== 应用层配置（历史存储 / 长文本分析）==========
app:
  # SQLite 唯一权威路径（历史记录与纠错样本均存于此）
  db_path: "data/app/history.db"
  # 单条原文入库最大长度（超出截断）
  max_input_store_len: 500
  long_text:
    # 长文本切句后参与分析的最大句数
    max_sentences: 100
    # 短于此长度的句子直接丢弃
    min_sentence_len: 2
  feedback:
    # 纠错样本导出目录（CSV 列与 data/processed_emotion/train.csv 对齐）
    export_dir: "data/feedback"

# ========== RAG 检索增强精判 ==========
rag:
  enabled: true
  # BERT 置信度低于该阈值时触发检索 + LLM 精判
  confidence_threshold: 0.75
  # 双触发：预测为焦虑但 top1-top2 概率差小于该值时，即使高置信也触发精判
  # 设为 1.0 = 所有焦虑预测一律触发精判（实测：焦虑高置信误判 10/10 可被 LLM 纠正）
  anxious_gap_threshold: 1.0
  top_k: 5                   # 检索相似已标注样本数
  # 向量索引缓存目录（embedding 用本地 bert-base-chinese mean-pooling，无需外网下载）
  index_dir: "data/rag_index"
  # 检索语料：已清洗+标签修正的训练集
  corpus_file: "data/processed_emotion/train_augmented_v2_cleaned_fixed2.csv"
  # DeepSeek API Key（也可通过环境变量 DEEPSEEK_API_KEY 覆盖，优先级更高）
  deepseek_api_key: ""
